# Official OmniDocBench end2end scoring config for linux-rocm predictions.
# Paths are absolute for the AMD evaluation host layout.
end2end_eval:
  metrics:
    text_block:
      metric:
        - Edit_dist
    display_formula:
      metric:
        - Edit_dist
        - CDM
      cdm_workers: 13
    table:
      metric:
        - TEDS
        - Edit_dist
      teds_workers: 13
    reading_order:
      metric:
        - Edit_dist
  dataset:
    dataset_name: end2end_dataset
    ground_truth:
      data_path: /root/workspace/data/OmniDocBench/OmniDocBench.json
    prediction:
      data_path: /root/workspace/Dolphin-v2-ROCm/results/omnidocbench/v16/linux-rocm/markdown
    match_method: quick_match
    match_workers: 13
    quick_match_truncate_timeout_sec: 300
    match_timeout_sec: 420
    timeout_fallback_max_chunk_span: 10
    timeout_fallback_order_penalty: 0.10
