name: ci

on:
  push:
    branches: [main, feat/rocm-adaptation]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Unit and contract tests
        run: pytest -q

      - name: Schema files present
        run: |
          test -f eval/schemas/run_summary.schema.json
          test -f eval/schemas/provenance.schema.json
          test -f eval/schemas/page_result.schema.json
          test -f eval/schemas/performance.schema.json

      - name: Secret / weight leak guard
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\\.(safetensors|bin|pth|pem|key)$|\\.env$|id_rsa'; then
            echo "Forbidden tracked files detected" >&2
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|HF_TOKEN=|huggingface.*token' -- ':!MODEL_LICENSE' ':!NOTICE' ':!docs/**' || true; then
            matches=$(git grep -nE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|HF_TOKEN=' -- . || true)
            if [[ -n "${matches}" ]]; then
              echo "${matches}" >&2
              exit 1
            fi
          fi

      - name: README relative links exist
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          missing = []
          for readme in [root/'README.md', root/'README.zh-CN.md']:
              if not readme.exists():
                  continue
              text = readme.read_text(encoding='utf-8')
              for m in re.finditer(r'\[[^\]]+\]\(([^)]+)\)', text):
                  target = m.group(1)
                  if target.startswith(('http://','https://','mailto:','#')):
                      continue
                  path = (readme.parent / target.split('#')[0]).resolve()
                  if not path.exists():
                      missing.append(f'{readme}: {target}')
          if missing:
              print('Missing README links:\\n' + '\\n'.join(missing))
              sys.exit(1)
          print('README links OK')
          PY
